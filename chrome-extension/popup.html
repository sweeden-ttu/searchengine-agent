<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Private Search Engine</h1>
    <button id="extractBtn">Extract Page to Markdown</button>
    <div id="extractStatus"></div>
    <hr>
    <h2>Crawl Website</h2>
    <button id="selectSearchBoxBtn">1. Select Search Box</button>
    <div id="searchBoxStatus"></div>
    <textarea id="searchTerms" rows="4" placeholder="Enter search terms (one per line)"></textarea>
    <button id="startCrawlBtn">2. Start Crawl</button>
    <div id="crawlStatus"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
